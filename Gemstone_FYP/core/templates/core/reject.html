{% extends "core/base.html" %}
{% load static %}

{% block title %}Unsupported Image{% endblock %}

{% block extra_css %}

<link rel="stylesheet" href="{% static 'core/css/style.css' %}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

.reject-page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.reject-card{

    max-width:700px;
    width:100%;

    margin:auto;

    padding:55px 45px;

    text-align:center;

    border-radius:28px;

    background:rgba(255,255,255,.92);

    border:1px solid rgba(255,255,255,.8);

    backdrop-filter:blur(20px);

    box-shadow:0 20px 60px rgba(0,0,0,.12);

    animation:fadeUp .7s ease;
}

.reject-icon{

    width:110px;
    height:110px;

    margin:0 auto 30px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#fff4d6;

    color:#f4b400;

    font-size:58px;

    animation:pulse 2s infinite;
}

.reject-title{

    font-size:38px;
    font-weight:800;

    color:#222;

    margin-bottom:18px;
}

.reject-message{

    color:#555;

    font-size:18px;

    line-height:1.8;

    margin-bottom:30px;
}

.reject-confidence{

    display:inline-block;

    padding:12px 26px;

    border-radius:50px;

    background:#f5f7fb;

    border:1px solid #e2e8f0;

    color:#333;

    font-weight:600;

    margin-bottom:35px;
}

.upload-btn{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    padding:15px 38px;

    border-radius:50px;

    text-decoration:none;

    background:linear-gradient(135deg,#6c63ff,#4f8cff);

    color:#fff;

    font-size:17px;
    font-weight:700;

    transition:.3s ease;
}

.upload-btn:hover{

    color:#fff;

    transform:translateY(-3px);

    box-shadow:0 15px 35px rgba(79,140,255,.35);
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }

}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>

{% endblock %}

{% block content %}

<section class="hero-section reject-page">

    <div class="bg-blobs">

        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>

    </div>

    <div class="container">

        <div class="reject-card">

            <div class="reject-icon">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>

            <h1 class="reject-title">
                Not A Gemstone Image
            </h1>

            <p class="reject-message">
                {{ warning }}
            </p>

            <div class="reject-confidence">
                Confidence Score:
                <strong>{{ confidence }}%</strong>
            </div>

            <br>

            <a href="{% url 'home' %}" class="upload-btn">
                <i class="bi bi-arrow-repeat"></i>
                Upload Another Image
            </a>

        </div>

    </div>

</section>

{% endblock %}
