<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            My Website
        {% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            height:100%;
        }

        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            overflow-x:hidden;

            background: linear-gradient(135deg, #1F2937 0%, #111827 50%, #0F172A 100%);
            {% comment %} background:#f8fafc; {% endcomment %}
            color:#1e293b;

            font-family:"Inter","Segoe UI",Tahoma,Geneva,Verdana,sans-serif;

            transition:background .3s ease,color .3s ease;
        }

        main{
            flex:1;
            width:100%;
            position:relative;

            background: transparent;
        }
        /* Mobile Background */

        
        
        footer{
            margin-top:auto;
            background:#111827;
            color:#ffffff;
            padding:20px 0;
        }

        .navbar-brand{
            font-weight:700;
            letter-spacing:1px;
        }

        img{
            max-width:100%;
            height:auto;
        }

        a{
            text-decoration:none;
        }

    </style>

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- ================= Navbar ================= -->

    {% include "core/navbar.html" %}

    <!-- ================= Main Content ================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>

    <!-- ================= Footer ================= -->

    {% include "core/footer.html" %}

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
